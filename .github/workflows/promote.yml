name: Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - aio
          - dev
          - test
          - prod

      image_tag:
        description: 'GHCR image tag to promote'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  promote:
    name: Promote to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            echo "Image tag cannot be empty."
            exit 1
          fi

          echo "Image tag: $IMAGE_TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image exists
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "Validating image:"
          echo "${IMAGE}:${IMAGE_TAG}"

          docker manifest inspect "${IMAGE}:${IMAGE_TAG}" > /dev/null

          echo "Image exists."

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: eduhamuy/eduhamuy-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Validate environment configuration
        working-directory: gitops
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          OVERLAY="environments/${ENVIRONMENT}/eduhamuy-web"
          KUSTOMIZATION="${OVERLAY}/kustomization.yaml"

          if [ ! -f "$KUSTOMIZATION" ]; then
            echo "GitOps overlay not found:"
            echo "$KUSTOMIZATION"
            exit 1
          fi

          echo "GitOps overlay:"
          echo "$KUSTOMIZATION"

      - name: Update image tag
        working-directory: gitops
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          KUSTOMIZATION="environments/${ENVIRONMENT}/eduhamuy-web/kustomization.yaml"

          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" "$KUSTOMIZATION"

          echo "GitOps change:"
          git diff -- "$KUSTOMIZATION"

      - name: Validate Kustomize
        working-directory: gitops
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          kubectl kustomize \
            "environments/${ENVIRONMENT}/eduhamuy-web" \
            > /dev/null

          echo "Kustomize validation passed."

      - name: Configure Git
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create GitOps branch
        working-directory: gitops
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          SHORT_TAG="$(echo "$IMAGE_TAG" | cut -c1-12)"
          BRANCH="promote/${ENVIRONMENT}-${SHORT_TAG}"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git checkout -b "$BRANCH"

      - name: Commit GitOps change
        working-directory: gitops
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          git add "environments/${ENVIRONMENT}/eduhamuy-web/kustomization.yaml"

          git commit \
            -m "chore(promote): deploy ${IMAGE_TAG} to ${ENVIRONMENT}"

      - name: Push GitOps branch
        working-directory: gitops
        run: |
          git push origin "$BRANCH"

      - name: Create GitOps Pull Request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          gh pr create \
            --repo eduhamuy/eduhamuy-gitops \
            --base main \
            --head "$BRANCH" \
            --title "chore(promote): deploy ${IMAGE_TAG} to ${ENVIRONMENT}" \
            --body "Promotion requested from eduhamuy-web.

          Image: ghcr.io/${{ github.repository }}:${IMAGE_TAG}

          Environment: ${ENVIRONMENT}

          Source workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
