name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  container:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:dev

  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: container

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: eduhamuy/eduhamuy-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update DEV image tag
        working-directory: gitops
        run: |
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" \
            environments/dev/eduhamuy-web/kustomization.yaml

      - name: Show GitOps change
        working-directory: gitops
        run: |
          git diff -- environments/dev/eduhamuy-web/kustomization.yaml

      - name: Create GitOps branch
        working-directory: gitops
        run: |
          git checkout -b deploy/dev-${{ github.sha }}

      - name: Commit GitOps change
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add environments/dev/eduhamuy-web/kustomization.yaml

          git commit \
            -m "chore(deploy): update dev image to ${{ github.sha }}"

      - name: Push GitOps branch
        working-directory: gitops
        run: |
          git push origin deploy/dev-${{ github.sha }}

      - name: Create GitOps Pull Request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gh pr create \
            --repo eduhamuy/eduhamuy-gitops \
            --base main \
            --head "deploy/dev-${IMAGE_TAG}" \
            --title "chore(deploy): update dev image to ${IMAGE_TAG}" \
            --body "Automated deployment update from eduhamuy-web.

          Image: ghcr.io/eduhamuy/eduhamuy-web:${IMAGE_TAG}

          Environment: DEV"
